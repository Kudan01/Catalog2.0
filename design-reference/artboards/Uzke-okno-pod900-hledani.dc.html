<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Catalog – hlavička pod 900 px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#12151c}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;padding:0;border-radius:9px;border:1px solid #2c3242;background:#1a1e27;color:#e6e9f0;font:inherit;font-size:14px;cursor:pointer;box-sizing:border-box}
.ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#9aa3b5;font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 760px; background: #12151c; color: #eef1f6; font-family: Inter, system-ui, sans-serif; font-size: 14px">
<sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
<header style="height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #151922; border-bottom: 1px solid #232836; box-sizing: border-box">
<button class="hb" type="button" aria-label="Strom složek"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
<span style="font-size: 32px; font-weight: 700; color: {{ accent }}; line-height: 1">Catalog 2.0</span>
<span style="margin-left: auto; display: flex; gap: 8px">
<button class="hb" type="button" aria-label="Hledat" aria-expanded="false" onClick="{{ open }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button class="hb" type="button" title="Oblíbené" aria-label="Oblíbené"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></button>
<button class="hb" type="button" title="Nastavení" aria-label="Nastavení"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</span>
</header>
</sc-if>
<sc-if value="{{ opened }}" hint-placeholder-val="{{ false }}">
<header style="height: 72px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #151922; border-bottom: 1px solid #232836; box-sizing: border-box">
<button class="ic" type="button" aria-label="Zavřít hledání" onClick="{{ close }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="flex: 1; display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 4px 0 14px; border-radius: 10px; border: 1px solid {{ accent }}; background: #1a1e27; box-sizing: border-box">
<label for="q8" style="position: absolute; left: -9999px">Hledat</label>
<input id="q8" type="search" placeholder="Hledat název nebo cestu…" style="flex: 1; min-width: 0; background: none; border: 0; color: #eef1f6; font: inherit; font-size: 14px; outline: none">
<button class="ic" type="button" aria-label="Hledat jen v aktuální složce"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
</div>
</header>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f06d32","options":["#f06d32","#4f8cff","#2fb38a"]},"$preview":{"width":760,"height":72}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  renderVals() {
    return {
      accent: this.props.accent ?? '#f06d32',
      closed: !this.state.open,
      opened: this.state.open,
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
