<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Catalog – výsledky hledání</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#12151c}
a{color:#c9cfdb;text-decoration:none}a:hover{color:#ffffff}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:1px solid #2c3242;background:#1a1e27;color:#e6e9f0;font:inherit;font-size:14px;cursor:pointer;box-sizing:border-box}
.ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#9aa3b5;font:inherit;cursor:pointer}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:#9aa3b5;font:inherit;font-size:14px;padding:8px 2px;cursor:pointer}
.pg{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid #2c3242;background:#1a1e27;color:#dfe3ec;font:inherit;font-size:16px;cursor:pointer}
.grp a.path:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; min-height: 1760px; background: #12151c; color: #eef1f6; font-family: Inter, system-ui, sans-serif; font-size: 14px">

<header style="border-bottom: 1px solid #232836; background: #151922">
<div style="padding: 14px 32px; display: flex; align-items: center; gap: 18px; box-sizing: border-box">
<button class="hb" type="button" aria-label="Strom složek" style="padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></button>
<div style="display: flex; flex-direction: column; line-height: 1">
<span style="font-size: 40px; font-weight: 700; letter-spacing: -0.01em; color: {{ accent }}">Catalog 2.0</span>
<a href="https://github.com/Kudan01/Catalog2.0" style="font-size: 11px; color: #9aa3b5; margin-top: 3px">GitHub: Kudan01</a>
</div>
<div style="flex: 1 1 420px; max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 4px 0 14px; border-radius: 10px; border: 1px solid #2c3242; background: #1a1e27; box-sizing: border-box">
<label for="qs" style="position: absolute; left: -9999px">Hledat</label>
<input id="qs" type="search" value="itálie" style="flex: 1; min-width: 0; background: none; border: 0; color: #eef1f6; font: inherit; font-size: 14px; outline: none">
<button class="ic" type="button" aria-label="Hledat jen v aktuální složce" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button>
<button class="ic" type="button" aria-label="Hledat" style="color: #c9cfdb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
</div>
<div style="display: flex; gap: 8px">
<button class="hb" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Oblíbené</button>
<button class="hb" type="button">Nastavení</button>
</div>
</div>
</header>

<main style="padding: 22px 32px 48px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; color: #ffffff">Výsledky pro „itálie“</h1>
<span style="display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid #2c3242; background: #1a1e27; font-size: 13px; color: #c9cfdb">v celém katalogu</span>
</div>
<p style="margin: 4px 0 0; color: #9aa3b5; font-size: 13px">3 složky · 1 948 fotek · 6 videí v 5 složkách</p>

<div style="display: flex; align-items: center; gap: 22px; margin-top: 16px; border-bottom: 1px solid #232836">
<button class="tab" type="button" style="color: #f3f5f9; border-bottom-color: {{ accent }}; font-weight: 500">Vše</button>
<button class="tab" type="button">Složky</button>
<button class="tab" type="button">Fotky</button>
<button class="tab" type="button" disabled="{{ true }}" style="color: #5f6778; cursor: default">GIFy</button>
<button class="tab" type="button">Videa</button>
<button class="tab" type="button" disabled="{{ true }}" style="color: #5f6778; cursor: default">Ostatní</button>
<span style="margin-left: auto; font-size: 13px; color: #c9cfdb; padding: 4px 6px">‹ 1 / 1 ›</span>
</div>

<section aria-label="Nalezené složky" style="margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px">
<sc-for list="{{ folders }}" as="f" hint-placeholder-count="3">
<article>
<div style="display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden">
<a href="#" aria-label="Otevřít složku {{ f.name }}" style="grid-row: 1 / 3; background: {{ f.a }}"></a>
<span style="background: {{ f.b }}"></span><span style="background: {{ f.c }}"></span><span style="background: {{ f.d }}"></span><span style="background: {{ f.a }}"></span>
</div>
<div style="margin-top: 8px; font-size: 15px; font-weight: 600; color: #ffffff">{{ f.pre }}<span style="text-decoration: underline; text-decoration-color: {{ accent }}; text-decoration-thickness: 2px; text-underline-offset: 3px">{{ f.hit }}</span>{{ f.post }}</div>
<div style="font-size: 12px; color: #9aa3b5; margin-top: 2px">{{ f.parent }}</div>
<div style="font-size: 13px; color: #9aa3b5; margin-top: 2px">{{ f.meta }}</div>
</article>
</sc-for>
</section>

<section aria-label="Nalezené fotky podle složek" style="margin-top: 34px; padding-top: 18px; border-top: 1px solid #232836; display: flex; flex-direction: column; gap: 26px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
<div class="grp">
<div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px">
<a class="path" href="#" style="font-size: 15px; color: #dfe3ec">{{ g.before }}<span style="text-decoration: underline; text-decoration-color: {{ accent }}; text-decoration-thickness: 2px; text-underline-offset: 3px">{{ g.hit }}</span>{{ g.after }}</a>
<span style="font-size: 13px; color: #9aa3b5">{{ g.count }}</span>
<a href="#" style="margin-left: auto; font-size: 13px; color: #c9cfdb">Zobrazit vše →</a>
</div>
<div style="display: flex; gap: 6px; height: 180px; overflow: hidden">
<sc-for list="{{ g.tiles }}" as="t" hint-placeholder-count="8">
<span style="{{ t.style }}"></span>
</sc-for>
</div>
</div>
</sc-for>
</section>

<div style="display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 30px">
<button class="pg" type="button" aria-label="Předchozí stránka" disabled="{{ true }}" style="color: #5f6778">‹</button>
<span style="color: #9aa3b5; font-size: 14px; padding: 0 8px">1 / 1</span>
<button class="pg" type="button" aria-label="Další stránka" disabled="{{ true }}" style="color: #5f6778">›</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f06d32","options":["#f06d32","#4f8cff","#2fb38a"]},"$preview":{"width":1440,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#f06d32';
    const t = ['#3b3f4c', '#4a4038', '#34424a', '#463a45', '#3d4636', '#4b4a3a', '#3a3f55', '#50413c'];
    const folders = [
      ['Fotoaparát – ', 'Itálie', '', 'Fotky', '1 840 fotek · 12 videí'],
      ['', 'Itálie', ' léto', 'Fotky › Telefon 2023', '12 fotek'],
      ['', 'Itálie', '', 'Archiv › 2016', '62 fotek · 2 videa']
    ].map((d, i) => ({ pre: d[0], hit: d[1], post: d[2], name: d[0] + d[1] + d[2], parent: d[3], meta: d[4], a: t[(i * 3) % 8], b: t[(i * 3 + 2) % 8], c: t[(i * 3 + 4) % 8], d: t[(i * 3 + 6) % 8] }));
    const ratios = [1.5, 0.67, 1.5, 1.33, 0.75, 1.5, 1.78, 0.67, 1.5, 1.33];
    const groups = [
      ['Fotky › Fotoaparát – ', 'Itálie', '', '1 840 fotek · 12 videí'],
      ['Fotky › Telefon 2023 › ', 'Itálie', ' léto', '12 fotek'],
      ['Archiv › 2016 › ', 'Itálie', '', '62 fotek · 2 videa'],
      ['Stažené › Cestování › ', 'Itálie', ' – mapy', '24 fotek'],
      ['Fotky › Rodina › Toskánsko (', 'Itálie', ')', '10 fotek']
    ].map((d, gi) => ({
      before: d[0], hit: d[1], after: d[2], count: d[3],
      tiles: ratios.map((r, i) => ({ style: 'display: block; flex: none; height: 180px; width: ' + Math.round(r * 180) + 'px; border-radius: 6px; background: ' + t[(i * 5 + gi * 3) % 8] }))
    }));
    return { accent: accent, folders: folders, groups: groups };
  }
}
</script>
</body>
</html>
