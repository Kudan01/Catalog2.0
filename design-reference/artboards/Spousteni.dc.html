<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Catalog – spouštění</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#12151c}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #12151c; color: #eef1f6; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<span style="font-size: 56px; font-weight: 700; letter-spacing: -0.01em; color: {{ accent }}">Catalog 2.0</span>
<div role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 360px">
<div role="progressbar" aria-label="Spouštění" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width: 100%; height: 4px; border-radius: 2px; background: #232836; overflow: hidden"><div style="width: 60%; height: 100%; background: {{ accent }}"></div></div>
<span style="font-size: 15px; color: #dfe3ec">Catalog se spouští…</span>
<span style="font-size: 13px; color: #9aa3b5">Připravuji náhledy</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#f06d32","options":["#f06d32","#4f8cff","#2fb38a"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#f06d32' }; }
}
</script>
</body>
</html>
