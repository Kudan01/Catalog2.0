<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Catalog – výběr katalogu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#12151c}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:9px;border:1px solid #2c3242;background:#1a1e27;color:#e6e9f0;font:inherit;font-size:14px;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.hb:hover{border-color:#5b6478}
.ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:#9aa3b5;font:inherit;font-size:18px;cursor:pointer}
.ic:hover{background:#232836;color:#ffffff}
.cat{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:12px;border:1px solid #2c3242;background:#171b24}
.cat:hover{border-color:#5b6478}
.cat a{flex:1;min-width:0;color:inherit;text-decoration:none}
.mi{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#dfe3ec;font:inherit;font-size:14px;cursor:pointer}
.mi:hover{background:#232836}
.lg{height:32px;padding:0 12px;border:0;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; background: #12151c; color: #eef1f6; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">

<div style="position: absolute; top: 24px; right: 28px; z-index: 6">
<button type="button" aria-haspopup="listbox" aria-expanded="{{ langOpen }}" aria-label="Language / Jazyk: {{ langName }}" onClick="{{ toggleLang }}" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid #2c3242; background: #171b24; color: #dfe3ec; font: inherit; font-size: 13px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"></path></svg>{{ langName }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
<ul role="listbox" aria-label="Language / Jazyk" style="position: absolute; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px; list-style: none; width: 180px; border-radius: 10px; background: #1d222d; border: 1px solid #3a4152; box-shadow: 0 16px 40px rgba(0,0,0,.55)">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="2">
<li role="option" aria-selected="{{ l.sel }}"><button class="mi" type="button" onClick="{{ l.pick }}" style="{{ l.style }}">{{ l.name }}</button></li>
</sc-for>
</ul>
</sc-if>
</div>

<span style="font-size: 40px; font-weight: 700; letter-spacing: -0.01em; color: #f06d32">Catalog 2.0</span>
<div style="width: 640px">
<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px">
<h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 600">{{ t.title }}</h1>
<button class="hb" type="button">{{ t.addExisting }}</button>
<button class="hb" type="button" style="background: #f06d32; border-color: #f06d32; color: #ffffff; font-weight: 500">{{ t.newCat }}</button>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="3">
<li class="cat" style="{{ c.rowStyle }}">
<span aria-hidden="true" style="width: 52px; height: 52px; flex: none; border-radius: 8px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; overflow: hidden; opacity: {{ c.op }}"><span style="grid-row: 1 / 3; background: {{ c.a }}"></span><span style="background: {{ c.b }}"></span><span style="background: {{ c.d }}"></span></span>
<a href="#" aria-label="{{ c.name }}">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 600; color: #ffffff">{{ c.name }}</span><sc-if value="{{ c.missing }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #2a2116; border: 1px solid #6b4a22; color: #f0c48a">{{ t.notFound }}</span></sc-if></div>
<div style="font-size: 13px; color: #9aa3b5; margin-top: 3px">{{ c.meta }}</div>
<div style="font-size: 12px; color: #7f889b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.path }}</div>
</a>
<sc-if value="{{ c.missing }}" hint-placeholder-val="{{ false }}"><button class="hb" type="button" style="height: 36px">{{ t.find }}</button></sc-if>
<button class="ic" type="button" aria-label="{{ t.more }}" aria-expanded="{{ c.open }}" onClick="{{ c.toggle }}">⋯</button>
<sc-if value="{{ c.open }}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position: absolute; z-index: 5; right: 12px; top: calc(100% - 6px); width: 260px; padding: 6px; border-radius: 10px; background: #1d222d; border: 1px solid #3a4152; box-shadow: 0 16px 40px rgba(0,0,0,.55)">
<sc-for list="{{ c.items }}" as="m" hint-placeholder-count="4">
<button class="mi" type="button" role="menuitem" onClick="{{ m.act }}">{{ m.label }}</button>
</sc-for>
</div>
</sc-if>
</li>
</sc-for>
</ul>
</div>

<sc-if value="{{ dlg }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(8,10,14,.75); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-label="{{ t.removeTitle }}" style="width: 480px; box-sizing: border-box; padding: 26px; border-radius: 14px; background: #171b24; border: 1px solid #2c3242; box-shadow: 0 24px 60px rgba(0,0,0,.6)">
<h2 style="margin: 0; font-size: 20px; font-weight: 600">{{ t.removeTitle }} „{{ dlgName }}“</h2>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: #9aa3b5">{{ t.removeText }}</p>
<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; flex-wrap: wrap">
<button class="hb" type="button" onClick="{{ closeDlg }}">{{ t.cancel }}</button>
<button class="hb" type="button" onClick="{{ closeDlg }}">{{ t.removeList }}</button>
<button class="hb" type="button" onClick="{{ closeDlg }}" style="background: #b4442a; border-color: #b4442a; color: #ffffff; font-weight: 500">{{ t.deleteCat }}</button>
</div>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'en', open: null, dlg: null, langOpen: false }; }
  renderVals() {
    const en = this.state.lang === 'en';
    const T = en ? {
      title: 'Choose a catalog', addExisting: 'Add existing…', newCat: '+ New catalog', notFound: 'Not found', find: 'Locate…', more: 'More actions',
      rename: 'Rename', openFolder: 'Open catalog folder', shortcut: 'Create desktop shortcut', remove: 'Remove…', removeList: 'Remove from list',
      removeTitle: 'Remove catalog', removeText: 'Remove from list keeps the catalog data on disk, so you can add it back later. Delete catalog removes its data and thumbnails. Your photos and videos are never deleted.',
      cancel: 'Cancel', deleteCat: 'Delete catalog',
      m1: '48,312 photos · 1,204 videos · opened today', m2: '9,860 photos · opened 3 days ago', m3: 'Catalog folder was moved or deleted',
      src: 'Source: '
    } : {
      title: 'Vyberte katalog', addExisting: 'Přidat existující…', newCat: '+ Nový katalog', notFound: 'Nenalezen', find: 'Najít…', more: 'Další akce',
      rename: 'Přejmenovat', openFolder: 'Otevřít složku katalogu', shortcut: 'Vytvořit zástupce na ploše', remove: 'Odebrat…', removeList: 'Jen odebrat ze seznamu',
      removeTitle: 'Odebrat katalog', removeText: 'Odebráním ze seznamu zůstanou data katalogu na disku a katalog můžete později přidat zpět. Smazáním se odstraní data katalogu i náhledy. Vaše fotky a videa se nikdy nemažou.',
      cancel: 'Zrušit', deleteCat: 'Smazat katalog',
      m1: '48 312 fotek · 1 204 videí · otevřeno dnes', m2: '9 860 fotek · otevřeno před 3 dny', m3: 'Složka katalogu byla přesunuta nebo smazána',
      src: 'Zdroj: '
    };
    const t = ['#3b3f4c', '#4a4038', '#34424a', '#463a45', '#3d4636', '#4b4a3a', '#3a3f55', '#50413c'];
    const defs = [['Rodinné fotky', T.m1, T.src + 'E:\\Fotky', false], ['Archiv skenů', T.m2, T.src + 'D:\\Skeny', false], ['Stažené', T.m3, 'D:\\Katalogy\\Stažené', true]];
    const cats = defs.map((d, i) => {
      const open = this.state.open === i;
      const close = () => this.setState({ open: null });
      const items = (d[3] ? [[T.removeList, () => this.setState({ open: null })]] : [
        [T.rename, close], [T.openFolder, close], [T.shortcut, close], [T.remove, () => this.setState({ open: null, dlg: i })]
      ]).map((x) => ({ label: x[0], act: x[1] }));
      return {
        name: d[0], meta: d[1], path: d[2], missing: d[3], op: d[3] ? 0.35 : 1,
        rowStyle: d[3] ? 'border-style: dashed' : '',
        a: t[(i * 3) % 8], b: t[(i * 3 + 2) % 8], d: t[(i * 3 + 5) % 8],
        open: open, toggle: () => this.setState({ open: open ? null : i }), items: items
      };
    });
    return {
      t: T, cats: cats,
      langOpen: this.state.langOpen, langName: en ? 'English' : 'Čeština',
      toggleLang: () => this.setState({ langOpen: !this.state.langOpen }),
      langs: [['en', 'English'], ['cs', 'Čeština']].map((x) => ({ name: x[1], sel: this.state.lang === x[0] ? 'true' : 'false', style: this.state.lang === x[0] ? 'color: #ffffff; font-weight: 600' : '', pick: () => this.setState({ lang: x[0], langOpen: false }) })),
      dlg: this.state.dlg !== null, dlgName: this.state.dlg !== null ? defs[this.state.dlg][0] : '',
      closeDlg: () => this.setState({ dlg: null })
    };
  }
}
</script>
</body>
</html>
